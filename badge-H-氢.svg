<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="400" height="580">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#5FD6CD"/>
    </linearGradient>
    <radialGradient id="imgBg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E0F7F5"/>
      <stop offset="100%" stop-color="#B2EBF2"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 卡片 -->
  <rect x="10" y="10" width="380" height="560" rx="28" fill="white" filter="url(#shadow)"/>
  <rect x="10" y="10" width="380" height="560" rx="28" fill="none" stroke="url(#bgGrad)" stroke-width="4"/>

  <!-- 顶部色条 -->
  <path d="M 10 38 Q 10 10 38 10 L 362 10 Q 390 10 390 38 L 390 90 L 10 90 Z" fill="url(#topBar)"/>
  <text x="40" y="55" font-family="Arial" font-size="28" font-weight="bold" fill="white">1</text>
  <text x="40" y="78" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.8)">I A · PERIOD 1</text>

  <!-- 元素符号印章 -->
  <rect x="310" y="18" width="65" height="55" rx="12" fill="white" opacity="0.95"/>
  <text x="342" y="56" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#4ECDC4" text-anchor="middle">H</text>

  <!-- 插图圆底 -->
  <circle cx="200" cy="205" r="95" fill="url(#imgBg)" stroke="#4ECDC4" stroke-width="3"/>

  <!-- 氢原子插图 -->
  <circle cx="200" cy="205" r="16" fill="#FF6B6B"/>
  <circle cx="195" cy="200" r="5" fill="#FF8E8E" opacity="0.7"/>
  <text x="200" y="210" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">p+</text>
  <ellipse cx="200" cy="205" rx="75" ry="28" fill="none" stroke="#4ECDC4" stroke-width="1.5" stroke-dasharray="3,3" transform="rotate(-30 200 205)"/>
  <ellipse cx="200" cy="205" rx="75" ry="28" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="3,3" transform="rotate(60 200 205)" opacity="0.6"/>
  <circle cx="270" cy="175" r="8" fill="#4ECDC4"/>
  <circle cx="267" cy="172" r="3" fill="white" opacity="0.6"/>
  <text x="270" y="179" font-family="Arial" font-size="8" font-weight="bold" fill="white" text-anchor="middle">e-</text>

  <!-- 状态大标签 -->
  <rect x="265" y="320" width="110" height="32" rx="16" fill="#4ECDC4"/>
  <text x="320" y="342" font-family="Arial" font-size="16" font-weight="bold" fill="white" text-anchor="middle">☁ GAS</text>

  <!-- 英文全称 -->
  <text x="40" y="350" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2C3E50">Hydrogen</text>

  <!-- 分类标签 -->
  <text x="40" y="373" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#4ECDC4" letter-spacing="1">非金属 · NONMETAL</text>

  <!-- 中文名 -->
  <text x="40" y="403" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#5D6D7E">氢</text>

  <!-- 特性标签 (暖色调，区别于日常用途) -->
  <text x="40" y="425" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#95A5A6" letter-spacing="1">PROPERTIES</text>
  <g transform="translate(40, 445)">
    <rect x="0" y="-15" width="75" height="26" rx="13" fill="#FFF0F0"/>
    <text x="37" y="3" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#C0392B" text-anchor="middle">🪶 最轻</text>

    <rect x="85" y="-15" width="75" height="26" rx="13" fill="#FFF0F0"/>
    <text x="122" y="3" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#C0392B" text-anchor="middle">🔥 易燃</text>

    <rect x="170" y="-15" width="115" height="26" rx="13" fill="#FFF0F0"/>
    <text x="227" y="3" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#C0392B" text-anchor="middle">🌌 宇宙最丰富</text>
  </g>

  <!-- 日常用途标签 (分类色，从特性衍生) -->
  <text x="40" y="485" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#95A5A6" letter-spacing="1">DAILY USE</text>
  <g transform="translate(40, 505)">
    <rect x="0" y="-15" width="110" height="26" rx="13" fill="#E0F7F5"/>
    <text x="55" y="3" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#2A9D8F" text-anchor="middle">🚀 火箭燃料</text>

    <rect x="120" y="-15" width="110" height="26" rx="13" fill="#E0F7F5"/>
    <text x="175" y="3" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#2A9D8F" text-anchor="middle">⚡ 未来能源</text>
  </g>

  <!-- 原子量 -->
  <text x="40" y="545" font-family="Arial" font-size="13" fill="#95A5A6">1.008</text>

  <!-- 稀有度 -->
  <rect x="40" y="558" width="320" height="6" rx="3" fill="#F0F0F0"/>
  <rect x="40" y="558" width="90" height="6" rx="3" fill="#B0BEC5"/>
</svg>
