<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="400" height="580">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667EEA"/>
      <stop offset="100%" stop-color="#764BA2"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667EEA"/>
      <stop offset="100%" stop-color="#7C94EA"/>
    </linearGradient>
    <radialGradient id="imgBg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="100%" stop-color="#FFE5A0"/>
    </radialGradient>
    <radialGradient id="goldAtom" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#FFECB3"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 卡片 -->
  <rect x="10" y="10" width="380" height="560" rx="28" fill="white" filter="url(#shadow)"/>
  <rect x="10" y="10" width="380" height="560" rx="28" fill="none" stroke="url(#bgGrad)" stroke-width="4"/>

  <!-- 顶部色条 -->
  <path d="M 10 38 Q 10 10 38 10 L 362 10 Q 390 10 390 38 L 390 90 L 10 90 Z" fill="url(#topBar)"/>
  <text x="40" y="55" font-family="Arial" font-size="28" font-weight="bold" fill="white">79</text>
  <text x="40" y="78" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.8)">I B · PERIOD 6</text>

  <!-- 元素符号印章 -->
  <rect x="310" y="18" width="65" height="55" rx="12" fill="white" opacity="0.95"/>
  <text x="342" y="56" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#667EEA" text-anchor="middle">Au</text>

  <!-- 插图圆底 -->
  <circle cx="200" cy="205" r="95" fill="url(#imgBg)" stroke="#FFD23F" stroke-width="3"/>

  <!-- 金晶体结构 -->
  <circle cx="200" cy="205" r="22" fill="url(#goldAtom)" filter="url(#goldGlow)"/>
  <circle cx="194" cy="199" r="6" fill="white" opacity="0.4"/>
  <circle cx="145" cy="160" r="16" fill="url(#goldAtom)"/>
  <circle cx="141" cy="156" r="4" fill="white" opacity="0.4"/>
  <circle cx="255" cy="160" r="16" fill="url(#goldAtom)"/>
  <circle cx="251" cy="156" r="4" fill="white" opacity="0.4"/>
  <circle cx="145" cy="250" r="16" fill="url(#goldAtom)"/>
  <circle cx="141" cy="246" r="4" fill="white" opacity="0.4"/>
  <circle cx="255" cy="250" r="16" fill="url(#goldAtom)"/>
  <circle cx="251" cy="246" r="4" fill="white" opacity="0.4"/>
  <circle cx="200" cy="150" r="13" fill="url(#goldAtom)" opacity="0.85"/>
  <circle cx="200" cy="260" r="13" fill="url(#goldAtom)" opacity="0.85"/>
  <circle cx="145" cy="205" r="13" fill="url(#goldAtom)" opacity="0.85"/>
  <circle cx="255" cy="205" r="13" fill="url(#goldAtom)" opacity="0.85"/>
  <line x1="145" y1="160" x2="255" y2="160" stroke="#F57F17" stroke-width="1" opacity="0.4"/>
  <line x1="145" y1="250" x2="255" y2="250" stroke="#F57F17" stroke-width="1" opacity="0.4"/>
  <line x1="145" y1="160" x2="145" y2="250" stroke="#F57F17" stroke-width="1" opacity="0.4"/>
  <line x1="255" y1="160" x2="255" y2="250" stroke="#F57F17" stroke-width="1" opacity="0.4"/>
  <line x1="145" y1="160" x2="200" y2="205" stroke="#F57F17" stroke-width="1" opacity="0.4"/>
  <line x1="255" y1="160" x2="200" y2="205" stroke="#F57F17" stroke-width="1" opacity="0.4"/>
  <line x1="145" y1="250" x2="200" y2="205" stroke="#F57F17" stroke-width="1" opacity="0.4"/>
  <line x1="255" y1="250" x2="200" y2="205" stroke="#F57F17" stroke-width="1" opacity="0.4"/>

  <!-- 状态大标签 -->
  <rect x="265" y="320" width="110" height="32" rx="16" fill="#7F8C8D"/>
  <text x="320" y="342" font-family="Arial" font-size="16" font-weight="bold" fill="white" text-anchor="middle">▪ SOLID</text>

  <!-- 英文全称 -->
  <text x="40" y="350" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2C3E50">Gold</text>

  <!-- 分类标签 -->
  <text x="40" y="373" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#667EEA" letter-spacing="1">过渡金属 · TRANSITION METAL</text>

  <!-- 中文名 -->
  <text x="40" y="403" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#5D6D7E">金</text>

  <!-- 特性标签 (暖色调) -->
  <text x="40" y="425" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#95A5A6" letter-spacing="1">PROPERTIES</text>
  <g transform="translate(40, 445)">
    <rect x="0" y="-15" width="90" height="26" rx="13" fill="#FFF0F0"/>
    <text x="45" y="3" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#C0392B" text-anchor="middle">🛡 不活泼</text>

    <rect x="100" y="-15" width="105" height="26" rx="13" fill="#FFF0F0"/>
    <text x="152" y="3" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#C0392B" text-anchor="middle">📏 延展性强</text>

    <rect x="215" y="-15" width="105" height="26" rx="13" fill="#FFF0F0"/>
    <text x="267" y="3" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#C0392B" text-anchor="middle">⚡ 导电性好</text>
  </g>

  <!-- 日常用途标签 (从特性衍生) -->
  <text x="40" y="485" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#95A5A6" letter-spacing="1">DAILY USE</text>
  <g transform="translate(40, 505)">
    <rect x="0" y="-15" width="110" height="26" rx="13" fill="#FFF9E6"/>
    <text x="55" y="3" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#F57F17" text-anchor="middle">💍 珠宝首饰</text>

    <rect x="120" y="-15" width="110" height="26" rx="13" fill="#FFF9E6"/>
    <text x="175" y="3" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#F57F17" text-anchor="middle">💻 电子元件</text>

    <rect x="240" y="-15" width="110" height="26" rx="13" fill="#FFF9E6"/>
    <text x="295" y="3" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#F57F17" text-anchor="middle">💰 黄金储备</text>
  </g>

  <!-- 原子量 -->
  <text x="40" y="545" font-family="Arial" font-size="13" fill="#95A5A6">196.967</text>

  <!-- 稀有度 -->
  <rect x="40" y="558" width="320" height="6" rx="3" fill="#F0F0F0"/>
  <rect x="40" y="558" width="305" height="6" rx="3" fill="#FFD23F"/>
</svg>
