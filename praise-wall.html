<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夸夸墙 ✨</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #FFF9E6;
  --card: #FFF;
  --border: #E2E4EA;
  --text: #333;
  --text2: #666;
  --text3: #999;
  --accent: #FF6B35;
  --danger: #F43F5E;
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
}
html, body {
  height: 100%;
  font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* === HEADER === */
.header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(135deg, #FFE4E8, #FFF0F3, #FFF9E6);
  padding: 12px 20px 8px; text-align: center;
  box-shadow: 0 2px 12px rgba(255,107,53,0.1);
}
.header-title { font-size: 24px; font-weight: 800; color: var(--accent); }
.header-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }

/* === MONTH TABS === */
.month-bar {
  display: flex; gap: 6px; padding: 8px 16px;
  overflow-x: auto; background: var(--bg);
  position: sticky; top: 56px; z-index: 99;
  -webkit-overflow-scrolling: touch;
}
.month-bar::-webkit-scrollbar { display: none; }
.month-tab {
  padding: 6px 14px; border-radius: 16px;
  border: 2px solid var(--border); background: var(--card);
  font-size: 11px; font-weight: 700; color: var(--text2);
  cursor: pointer; white-space: nowrap; transition: all 0.2s;
  font-family: inherit;
}
.month-tab.active { background: var(--accent); color: #FFF; border-color: var(--accent); }

/* === PRAISE GRID === */
.praise-grid {
  padding: 12px 12px 100px;
  display: flex; flex-wrap: wrap; gap: 10px;
  justify-content: center; align-content: flex-start;
}

/* === PRAISE CARD === */
.praise-card {
  width: 180px;
  border-radius: 14px;
  padding: 14px 14px 10px;
  position: relative;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
  animation: cardIn 0.4s ease-out backwards;
  overflow: visible;
  display: flex;
  flex-direction: column;
}
.praise-card::before {
  content: ''; position: absolute; top: -15px; right: -15px;
  width: 50px; height: 50px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
}
.praise-card:active { transform: scale(0.96) !important; }
.praise-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.12); }

.praise-card.size-sm .card-content { font-size: 12px; }
.praise-card.size-lg .card-content { font-size: 14px; line-height: 1.8; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px) scale(0.92); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Sticker: small, top-right, semi-transparent */
.card-sticker {
  font-size: 22px;
  position: absolute;
  top: 8px; right: 10px;
  opacity: 0.5;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
}

/* Content */
.card-content {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
  word-break: break-word;
  flex: 1;
  padding-right: 24px;
}

/* Footer: bottom-right */
.card-footer {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  margin-top: 10px;
  gap: 6px;
}
.card-sender { display: flex; align-items: center; gap: 4px; }
.sender-avatar {
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 800; color: #FFF;
}
.sender-name { font-size: 9px; font-weight: 700; color: var(--text2); }
.card-time { font-size: 8px; color: var(--text3); }

/* Unread dot */
.card-unread {
  position: absolute; top: -4px; right: -4px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--danger); border: 2px solid var(--bg);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

/* Delete button */
.delete-btn {
  position: absolute; top: -8px; left: -8px;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--danger); color: #FFF;
  font-size: 14px; font-weight: 800;
  border: 2px solid var(--bg); cursor: pointer;
  display: none; align-items: center; justify-content: center;
  z-index: 10; font-family: inherit; line-height: 1;
}
.praise-card.editing .delete-btn { display: flex; }
.praise-card.editing { outline: 2px dashed var(--danger); outline-offset: 3px; }

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text3); width: 100%; }
.empty-emoji { font-size: 56px; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.empty-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--text2); }
.empty-sub { font-size: 11px; }

/* FAB */
.fab {
  position: fixed; bottom: 24px; right: 24px;
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, #FF6B35, #FFD23F);
  color: #FFF; font-size: 26px; font-weight: 800;
  border: none; box-shadow: 0 4px 20px rgba(255,107,53,0.4);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  z-index: 200; font-family: inherit;
}
.fab:active { transform: scale(0.9); }

/* Edit toggle */
.edit-toggle {
  position: fixed; bottom: 24px; left: 24px;
  padding: 10px 16px; border-radius: 20px;
  background: var(--card); border: 2px solid var(--border);
  font-size: 11px; font-weight: 700; color: var(--text2);
  cursor: pointer; z-index: 200; font-family: inherit;
  box-shadow: var(--shadow);
}
.edit-toggle.active { background: var(--danger); color: #FFF; border-color: var(--danger); }

/* Modal */
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: flex-end; justify-content: center; }
.modal.active { display: flex; }
.modal-content {
  background: #FFF; border-radius: 20px 20px 0 0;
  padding: 20px 18px 28px; width: 100%; max-width: 500px;
  max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header { text-align: center; margin-bottom: 16px; }
.modal-title { font-size: 18px; font-weight: 800; color: var(--accent); }
.modal-close { position: absolute; top: 14px; right: 18px; font-size: 22px; color: var(--text3); cursor: pointer; background: none; border: none; font-family: inherit; }

/* Form */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 10px; font-weight: 700; color: var(--text2); letter-spacing: 0.06em; margin-bottom: 6px; display: block; }
.textarea {
  width: 100%; padding: 10px; border: 2px solid var(--border);
  border-radius: 10px; font-size: 13px; font-family: inherit;
  resize: none; min-height: 70px; transition: border-color 0.2s; line-height: 1.5;
}
.textarea:focus { outline: none; border-color: var(--accent); }

.sticker-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.sticker-item {
  width: 36px; height: 36px; border-radius: 8px; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; transition: all 0.2s; border: 2px solid transparent;
}
.sticker-item.active { background: #FFF5F0; border-color: var(--accent); transform: scale(1.1); }

.sender-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.sender-btn {
  padding: 6px 12px; border-radius: 16px; border: 2px solid var(--border);
  background: var(--card); font-size: 11px; font-weight: 700;
  color: var(--text2); cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.sender-btn.active { border-color: var(--accent); background: var(--accent); color: #FFF; }

.submit-btn {
  width: 100%; padding: 12px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #FF6B35, #FFD23F);
  color: #FFF; font-size: 14px; font-weight: 800;
  cursor: pointer; font-family: inherit; margin-top: 6px;
}
.submit-btn:active { transform: scale(0.98); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Confirm dialog */
.confirm-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
.confirm-overlay.active { display: flex; }
.confirm-box { background: #FFF; border-radius: 16px; padding: 24px; text-align: center; max-width: 280px; width: 90%; }
.confirm-emoji { font-size: 40px; margin-bottom: 12px; }
.confirm-text { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
.confirm-btns { display: flex; gap: 10px; }
.confirm-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.confirm-btn.cancel { background: var(--bg); color: var(--text2); }
.confirm-btn.danger { background: var(--danger); color: #FFF; }

/* Falling petals */
.petal-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
.petal { position: absolute; animation: petalFall linear forwards; }
@keyframes petalFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

/* Toast */
.toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: linear-gradient(135deg, #FF6B35, #FFD23F);
  color: #FFF; padding: 16px 28px; border-radius: 14px;
  font-size: 14px; font-weight: 800;
  box-shadow: 0 8px 32px rgba(255,107,53,0.4);
  z-index: 10000; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
}
.toast.show { transform: translate(-50%, -50%) scale(1); }
.toast-emoji { font-size: 32px; display: block; margin-bottom: 6px; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text3); width: 100%; }
.loading-spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 360px) { .praise-card { width: 160px; } }
@media (min-width: 500px) { .praise-grid { max-width: 500px; margin: 0 auto; } .header { max-width: 500px; margin: 0 auto; } }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🌸 夸夸墙 🌸</div>
  <div class="header-sub">每一条夸奖都是爱的印记 ❤️</div>
</div>

<div class="month-bar" id="monthBar"></div>

<div class="praise-grid" id="praiseGrid">
  <div class="loading"><div class="loading-spinner"></div><div style="margin-top:10px;font-size:11px">加载中...</div></div>
</div>

<button class="fab" onclick="showAddModal()">+</button>
<button class="edit-toggle" id="editToggle" onclick="toggleEditMode()">📌 管理</button>

<!-- Add Modal -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <button class="modal-close" onclick="hideAddModal()">&times;</button>
    <div class="modal-header"><div class="modal-title">✨ 写一条夸夸</div></div>
    <div class="form-group"><label class="form-label">想说的话</label><textarea class="textarea" id="praiseContent" placeholder="写下你想对孩子说的话..." maxlength="500"></textarea></div>
    <div class="form-group"><label class="form-label">选择贴纸</label><div class="sticker-grid" id="stickerGrid"></div></div>
    <div class="form-group"><label class="form-label">发送者</label><div class="sender-grid" id="senderGrid"></div></div>
    <button class="submit-btn" id="submitBtn" onclick="submitPraise()">发送夸夸 🎉</button>
  </div>
</div>

<!-- Confirm -->
<div class="confirm-overlay" id="confirmDialog">
  <div class="confirm-box">
    <div class="confirm-emoji">🗑️</div>
    <div class="confirm-text">确定要删除这条夸夸吗？</div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel" onclick="cancelDelete()">取消</button>
      <button class="confirm-btn danger" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="toast-emoji">🎉</span>夸夸已送达！</div>
<div class="petal-container" id="petalContainer"></div>

<script>
var SB_URL = 'https://xzuxfvyktcqfecgljahr.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6dXhmdnlrdGNxZmVjZ2xqYWhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MzUyNzIsImV4cCI6MjEwMDExMTI3Mn0.TDwfqTbI5Dof5ZAuiVsttyVVXNubIox8HcrRgkOcnf0';
var sb = supabase.createClient(SB_URL, SB_KEY);

var praiseList = [], currentMonth = '', editMode = false, deleteTargetId = null;
var STICKERS = ['🌸','⭐','🌟','💖','🎀','🌈','🦋','🌺','💐','🎈','🍀','🌻','🏆','💎','👑','🥇','🔥','💪','🤗','❤️','🎉','✨','🌹','🧸','🎁','🍭','🌙','☀️'];
var BG_COLORS = ['#FFE4E8','#FFE0F0','#FFF0F3','#FFE8EC','#FFF3CD','#FFEDBA','#FFF8DC','#E8F5E9','#E0F2E9','#F0FFF4','#E5F5E8','#E8EAF6','#F3E5F5','#FCE4EC','#FFFDE7','#F1F8E9'];
var SIZE_CLASSES = ['', 'size-sm', 'size-lg'];
var SENDERS = [{name:'爸爸',color:'#3B82F6'},{name:'妈妈',color:'#F472B6'},{name:'爷爷',color:'#10B981'},{name:'奶奶',color:'#F97316'},{name:'老师',color:'#8B5CF6'},{name:'其他',color:'#6B7280'}];
var selectedSticker = '🌸', selectedSender = SENDERS[0];

document.addEventListener('DOMContentLoaded', function() {
  renderStickerGrid(); renderSenderGrid(); loadPraise();
});

function getMonthsFromData() {
  var months = {};
  for (var i = 0; i < praiseList.length; i++) {
    var d = new Date(praiseList[i].created_at);
    months[d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')] = true;
  }
  var now = new Date();
  months[now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0')] = true;
  return Object.keys(months).sort().reverse();
}

function renderMonthTabs() {
  var bar = document.getElementById('monthBar');
  var months = getMonthsFromData();
  if (!currentMonth || months.indexOf(currentMonth) < 0) currentMonth = months[0];
  var html = '';
  for (var i = 0; i < months.length; i++) {
    var p = months[i].split('-');
    var active = months[i] === currentMonth ? ' active' : '';
    html += '<button class="month-tab' + active + '" onclick="switchMonth(\'' + months[i] + '\')">' + p[0] + '年' + parseInt(p[1]) + '月</button>';
  }
  bar.innerHTML = html;
}

function switchMonth(m) { currentMonth = m; renderMonthTabs(); renderGrid(); }

async function loadPraise() {
  try {
    var r = await sb.from('praise').select().order('created_at', {ascending: false});
    if (r.data) { praiseList = r.data; renderMonthTabs(); renderGrid(); }
    else showEmpty();
  } catch (e) {
    console.error(e);
    document.getElementById('praiseGrid').innerHTML = '<div class="empty-state"><div class="empty-emoji">😅</div><div class="empty-title">加载失败</div><div class="empty-sub">请检查网络连接</div></div>';
  }
}

async function addPraise(data) {
  try {
    var result = await sb.from('praise').insert(data).select();
    if (result.error) { console.error(result.error); alert('错误: ' + result.error.message); }
    return result.data;
  } catch (e) { console.error(e); alert('异常: ' + e.message); return null; }
}

async function deletePraise(id) {
  try { await sb.from('praise').delete().eq('id', id); return true; }
  catch (e) { return false; }
}

async function markAsRead(id) {
  try { await sb.from('praise').update({is_read: true}).eq('id', id); } catch (e) {}
}

function renderGrid() {
  var grid = document.getElementById('praiseGrid');
  var filtered = praiseList.filter(function(p) {
    if (!currentMonth) return true;
    var d = new Date(p.created_at);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') === currentMonth;
  });
  if (!filtered.length) { showEmpty(); return; }

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var p = filtered[i];
    var rot = p.rotation !== undefined ? p.rotation : Math.round(Math.random() * 10 - 5);
    var bg = p.bg_color || BG_COLORS[Math.floor(Math.random() * BG_COLORS.length)];
    var sz = p.size_class || SIZE_CLASSES[Math.floor(Math.random() * SIZE_CLASSES.length)];

    // Full date/time
    var ts = new Date(p.created_at);
    var timeStr = ts.getFullYear() + '/' + String(ts.getMonth()+1).padStart(2,'0') + '/' + String(ts.getDate()).padStart(2,'0') + ' ' + String(ts.getHours()).padStart(2,'0') + ':' + String(ts.getMinutes()).padStart(2,'0');

    var ini = p.sender ? p.sender.charAt(0) : '?';
    var sc = p.sender_color || '#FF6B35';
    var ec = editMode ? ' editing' : '';
    var delay = i * 0.04;

    html += '<div class="praise-card ' + sz + ec + '" style="background:' + bg + ';transform:rotate(' + rot + 'deg);animation-delay:' + delay + 's" onclick="cardClick(' + p.id + ', event)">';
    html += '<button class="delete-btn" onclick="startDelete(' + p.id + ', event)">&times;</button>';
    if (!p.is_read) html += '<div class="card-unread"></div>';
    html += '<div class="card-sticker">' + (p.sticker || '🌸') + '</div>';
    html += '<div class="card-content">' + escHtml(p.content) + '</div>';
    html += '<div class="card-footer">';
    html += '<div class="card-sender"><div class="sender-avatar" style="background:' + sc + '">' + ini + '</div><span class="sender-name">' + escHtml(p.sender) + '</span></div>';
    html += '<span class="card-time">' + timeStr + '</span>';
    html += '</div></div>';
  }
  grid.innerHTML = html;
}

function showEmpty() {
  var msg = praiseList.length === 0
    ? {e:'🌸', t:'还没有夸夸', s:'点击 + 添加第一条吧！'}
    : {e:'📅', t:'这个月还没有夸夸', s:'切换到其他月份看看'};
  document.getElementById('praiseGrid').innerHTML = '<div class="empty-state"><div class="empty-emoji">' + msg.e + '</div><div class="empty-title">' + msg.t + '</div><div class="empty-sub">' + msg.s + '</div></div>';
}

function escHtml(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function toggleEditMode() {
  editMode = !editMode;
  var btn = document.getElementById('editToggle');
  btn.classList.toggle('active', editMode);
  btn.textContent = editMode ? '✓ 完成' : '📌 管理';
  renderGrid();
}

function cardClick(id, e) {
  if (editMode) return;
  var card = e.currentTarget;
  for (var i = 0; i < praiseList.length; i++) {
    if (praiseList[i].id === id) {
      if (!praiseList[i].is_read) {
        praiseList[i].is_read = true;
        markAsRead(id);
        var dot = card.querySelector('.card-unread');
        if (dot) dot.remove();
      }
      break;
    }
  }
}

function startDelete(id, e) { e.stopPropagation(); deleteTargetId = id; document.getElementById('confirmDialog').classList.add('active'); }
function cancelDelete() { deleteTargetId = null; document.getElementById('confirmDialog').classList.remove('active'); }
async function confirmDelete() {
  if (!deleteTargetId) return;
  var id = deleteTargetId; cancelDelete();
  var ok = await deletePraise(id);
  if (ok) { praiseList = praiseList.filter(function(p) { return p.id !== id; }); renderMonthTabs(); renderGrid(); }
  else alert('删除失败');
}

function renderStickerGrid() {
  var g = document.getElementById('stickerGrid');
  selectedSticker = STICKERS[0];
  var html = '';
  for (var i = 0; i < STICKERS.length; i++) {
    html += '<div class="sticker-item' + (i===0?' active':'') + '" onclick="selectSticker(\'' + STICKERS[i] + '\', this)">' + STICKERS[i] + '</div>';
  }
  g.innerHTML = html;
}

function renderSenderGrid() {
  var g = document.getElementById('senderGrid');
  selectedSender = SENDERS[0];
  var html = '';
  for (var i = 0; i < SENDERS.length; i++) {
    var s = SENDERS[i];
    var st = i===0 ? 'background:'+s.color+';border-color:'+s.color+';color:#FFF' : '';
    html += '<button class="sender-btn' + (i===0?' active':'') + '" style="'+st+'" onclick="selectSender('+i+', this)">' + s.name + '</button>';
  }
  g.innerHTML = html;
}

function selectSticker(s, el) {
  selectedSticker = s;
  document.querySelectorAll('.sticker-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
}

function selectSender(idx, el) {
  selectedSender = SENDERS[idx];
  document.querySelectorAll('.sender-btn').forEach(function(b) {
    b.classList.remove('active'); b.style.background=''; b.style.borderColor=''; b.style.color='';
  });
  el.classList.add('active');
  el.style.background = selectedSender.color;
  el.style.borderColor = selectedSender.color;
  el.style.color = '#FFF';
}

function showAddModal() {
  document.getElementById('addModal').classList.add('active');
  document.getElementById('praiseContent').value = '';
  renderStickerGrid(); renderSenderGrid();
}
function hideAddModal() { document.getElementById('addModal').classList.remove('active'); }

async function submitPraise() {
  var content = document.getElementById('praiseContent').value.trim();
  if (!content) {
    var ta = document.getElementById('praiseContent');
    ta.style.borderColor = '#F43F5E';
    setTimeout(function() { ta.style.borderColor = ''; }, 1500);
    return;
  }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '发送中...';

  var bg = BG_COLORS[Math.floor(Math.random() * BG_COLORS.length)];
  var rot = Math.round(Math.random() * 10 - 5);
  var sz = SIZE_CLASSES[Math.floor(Math.random() * SIZE_CLASSES.length)];

  var data = {
    type: 'praise', content: content, sticker: selectedSticker,
    sender: selectedSender.name, sender_color: selectedSender.color,
    bg_color: bg, rotation: rot, size_class: sz, is_read: false
  };

  var result = await addPraise(data);
  btn.disabled = false; btn.textContent = '发送夸夸 🎉';

  if (result) {
    hideAddModal(); showToast(); triggerPetals();
    var now = new Date();
    currentMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    praiseList.unshift(result[0]);
    renderMonthTabs(); renderGrid();
  } else {
    alert('发送失败，请重试');
  }
}

function triggerPetals() {
  var c = document.getElementById('petalContainer');
  var petals = ['🌸','⭐','🌟','💖','🎀','✨','🌺'];
  for (var i = 0; i < 18; i++) {
    (function(idx) {
      setTimeout(function() {
        var p = document.createElement('div');
        p.className = 'petal';
        p.textContent = petals[Math.floor(Math.random() * petals.length)];
        p.style.left = Math.random()*100 + '%';
        p.style.animationDuration = (2 + Math.random()*3) + 's';
        p.style.fontSize = (14 + Math.random()*14) + 'px';
        c.appendChild(p);
        setTimeout(function() { p.remove(); }, 5000);
      }, idx * 80);
    })(i);
  }
}

function showToast() {
  var t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

document.getElementById('addModal').addEventListener('click', function(e) { if (e.target === this) hideAddModal(); });
document.getElementById('confirmDialog').addEventListener('click', function(e) { if (e.target === this) cancelDelete(); });
</script>
</body>
</html>
